<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIDD — 先行研究 紹介動画</title>
<meta name="description" content="先行研究の紹介動画をカテゴリ別に閲覧できるサイト。球体を回して星を選ぶと動画が再生されます。">
<link rel="stylesheet" href="css/common.css">
<link rel="stylesheet" href="css/index.css">
</head>
<body class="page-index">

<div class="bg-glow"></div>

<!-- 入場アニメーション用のオーバーレイ -->
<div class="intro-veil" id="introVeil" aria-hidden="true">
  <div class="intro-spark"></div>
</div>

<main class="stage" id="stage">

  <h1 class="visually-hidden">HIDD 先行研究 紹介動画</h1>

  <div class="sphere-wrap" id="sphereWrap">
    <div class="sphere-canvas" id="sphereCanvas"
         role="application"
         aria-label="星の球体。ドラッグまたは矢印キーで回転、ホイール・ピンチ・プラスマイナスキーで拡大縮小します。明るい星がカテゴリ、周りの小さな星が動画です。"
         tabindex="0"></div>

    <!-- 星座線（球体の回転に追従して毎フレーム描き直す） -->
    <svg class="constellations" id="constellations" aria-hidden="true"></svg>

    <!-- 星とラベル（3D 座標に追従する HTML 要素） -->
    <div class="overlay" id="overlay" aria-hidden="true">
      <div class="brand" data-anchor="brand">高度ICTデザイン学科<br>研究成果動画</div>
    </div>

    <!-- 星から生えてくる再生カード -->
    <div class="grow" id="grow" hidden>
      <div class="grow__card" id="growCard">
        <div class="grow__head">
          <span class="grow__lab" id="growLab"></span>
          <button class="grow__close" type="button" id="growClose" aria-label="閉じる">&times;</button>
        </div>
        <h2 class="grow__title" id="growTitle"></h2>
        <div class="grow__player" id="growPlayer"></div>
        <p class="grow__summary" id="growSummary"></p>
        <div class="grow__bar"><span id="growProgress"></span></div>
      </div>
    </div>
  </div>

  <p class="status" id="status"></p>

  <!-- WebGL 非対応時のフォールバック兼、キーボード・支援技術向けの正規リンク -->
  <nav class="fallback-nav" id="fallbackNav" aria-label="カテゴリ">
    <p class="fallback-nav__title">カテゴリから選ぶ</p>
    <ul class="fallback-nav__list" id="fallbackList"></ul>
  </nav>

</main>

<script src="vendor/three.min.js"></script>
<script src="js/videos.js"></script>
<script src="js/data.js"></script>
<script src="js/geometry.js"></script>
<script src="js/texture-lab.js"></script>
<script src="js/stars.js"></script>
<script src="js/intro.js"></script>
</body>
</html>
